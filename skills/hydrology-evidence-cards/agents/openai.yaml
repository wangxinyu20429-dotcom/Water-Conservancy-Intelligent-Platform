interface:
  display_name: "水利科研证据卡"
  short_description: "把 Zotero 文献写成深入、可读、可核验的科研证据卡"
  brand_color: "#176B87"
  default_prompt: "Use $hydrology-evidence-cards to read a selected Zotero source and write a deep, human-readable research evidence card. Follow the source's own scientific logic instead of filling a fixed prose template. Reconstruct a named input-to-transformation-to-validation-to-result evidence path, not an abstract paraphrase or generic filler. Make the research question, object and scope, observed/derived/simulated data, independent unit, method chain, validation and comparisons, decisive results with denominators and uncertainty, author interpretation, scientific contribution, concrete research value, and conclusion boundaries easy to find. Do not create a universal reproduction section. For substantive full/partial-main-text research, require at least 5,000 non-whitespace source-grounded characters in the card body, including at least 3,000 visible scientific-narrative characters at L1 or 6,000 at L2/L3; rich L1 papers should normally reach 5,000-7,500 visible characters. Never pad with repeated abstracts, generic background, copied references or raw OCR. Put calibration notes and Claim audit fields in separate default-collapsed details blocks, validate R01-R09, and link only verified claims to a Decision/Synthesis card when needed."
policy:
  allow_implicit_invocation: true
