interface:
  display_name: "水利科研证据卡"
  short_description: "把 Zotero 文献写成人能直接读懂的科研证据卡"
  brand_color: "#176B87"
  default_prompt: "Use $hydrology-evidence-cards to read a selected Zotero source and write a human-readable research evidence card that explains the problem, method, key findings, contribution, limits, and relevance. Keep located Claim objects in a hidden machine-audit section, validate R01-R08, and link only verified claims to a Decision/Synthesis card when needed."
policy:
  allow_implicit_invocation: true
